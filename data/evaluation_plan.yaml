schema_version: 1

annotation_policy:
  scope: all_visible_instances

  default_actions:
    face: redact
    license_plate: redact

  identity_overrides:
    person_night_01: keep

  face:
    region: visible facial area
    annotate_when: at least one identity-bearing facial feature is visible
    do_not_annotate_when: only the back of the head is visible

  license_plate:
    region: physical plate rectangle
    annotate_when: a human can reliably localize the plate region
    text_readability_required: false

  temporal_state:
    outside_when_not_visible: true
    occluded_when_partially_occluded: true

  frame_boundary:
    clip_boxes_to_image: true

clips:
  day_plate:
    file: artifacts/eval_day_plate_close.mp4
    parent_file: artifacts/day_primary.mp4
    parent_start_seconds: 61
    duration_seconds: 18
    original_source_interval: "00:01:54-00:02:12"
    continuous_scene: true
    sha256: 4f19396fa1393c2861bfd26302b3147fc8ae29acfd55bf10f6e7be46a30231c9
    frame_count: 540
    primary_targets:
      - object_id: plate_day_01
        category: license_plate
        action: redact
    challenges:
      - close_plate
      - changing_scale
      - changing_perspective
      - moving_camera
      - partial_occlusion
    dense_verification:
      start_seconds: 2
      end_seconds: 12
    metrics:
      - observed_plate_leaked_frames
      - maximum_observed_consecutive_gap
      - manual_additions
      - flicker_events
      - processing_fps
      - review_time_seconds

  day_face:
    file: artifacts/eval_day_face.mp4
    parent_file: artifacts/day_primary.mp4
    parent_start_seconds: 154
    duration_seconds: 36
    original_source_interval: "00:03:27-00:04:03"
    continuous_scene: true
    sha256: fa131aa652a1f4bf3b88b88f66522bf8cd34cae23655da9a10cb053a6cb4c33d
    frame_count: 1079
    primary_targets:
      - object_id: person_day_01
        category: face
        action: redact
    challenges:
      - profile_face
      - head_rotation
      - partial_occlusion
      - moving_camera
    dense_verification:
      start_seconds: 10
      end_seconds: 20
    metrics:
      - observed_face_leaked_frames
      - maximum_observed_consecutive_gap
      - track_fragment_count
      - manual_corrections
      - flicker_events
      - processing_fps
      - review_time_seconds

  night_selective:
    file: artifacts/eval_night_selective.mp4
    parent_file: data/raw/night_candidate.mp4
    parent_start_seconds: 282
    duration_seconds: 53
    original_source_interval: "00:48:12-00:49:05"
    continuous_scene: true
    sha256: 0b55aa3a497941711ac8634a049c557637e20928e8d3bd8b63e5b030b6b272e0
    frame_count: 1589
    primary_targets:
      - object_id: person_night_01
        description: standing person
        category: face
        action: keep
      - object_id: person_night_02
        description: seated person wearing a cap
        category: face
        action: redact
      - object_id: plate_night_01
        description: rear plate of the white pickup
        category: license_plate
        action: redact
    challenges:
      - low_light
      - glare
      - multiple_people
      - partial_occlusion
      - selective_redaction
    dense_verification:
      start_seconds: 14
      end_seconds: 26
    metrics:
      - sensitive_identity_leaked_frames
      - keep_identity_false_redaction_frames
      - observed_plate_leaked_frames
      - maximum_observed_consecutive_gap
      - manual_corrections
      - processing_fps
      - review_time_seconds

supplementary_stress_tests:
  day_plate_far:
    file: artifacts/eval_day_plate.mp4
    sha256: 63d41905e2b6c65a3cdc72aa73ee31668fe1c1b4fdfefa2c5688cd38c90d1097
    frame_count: 570
    purpose: qualitative evaluation of a small and visually ambiguous distant plate
    required_for_final_success: false

evaluation_strategy:
  automated_pass:
    method: detector and tracker proposals

  human_review:
    full_clip_playback: true
    review_flagged_intervals: true
    dense_intervals_frame_by_frame: true
    record_errors_only: true

  full_manual_ground_truth_required: false

  optional_ground_truth:
    purpose: additional quantitative benchmarking if time permits

final_review_success:
  leaked_sensitive_object_frames: 0
  redacted_keep_identity_frames: 0

notes:
  - Evaluation is based on automated proposals followed by targeted human review.
  - Full manual bounding-box ground truth is optional, not required.
  - Quantitative recall and IoU must not be reported without independent ground truth.
  - Zero-leak claims apply only to intervals reviewed frame-by-frame.
  - The far-plate clip is a qualitative stress test because the plate is visually ambiguous at long range.
  - Annotate all visible faces and license plates, not only the listed primary targets.
  - Primary targets are used for per-object reporting and selective-policy tests.
  - A plate may be annotated even when its characters are not readable.
  - Identity labels are local visual identifiers, not real-world identities.
  - Keep and redact actions are analyst-provided test policies.
