[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-redaction-pipeline"
version = "0.1.0"
description = "Minimal local video inspection and development artifact pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "click>=8.1,<9",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.45,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
redactor = "redactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
