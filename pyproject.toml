[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "video-redaction-pipeline"
version = "0.1.0"
description = "Local video privacy redaction with face and plate detection, temporal tracking, frame-accurate rendering, evaluation, and human review."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "click>=8.1,<9",
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
inference = [
  "openvino==2026.2.1",
]
dev = [
  "playwright>=1.45,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
redactor = "redactor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "local_assets: validates private local release assets; opt in with REDACTOR_RUN_LOCAL_ASSET_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
